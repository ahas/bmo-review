# The review service's settings (docs/api.md, 「Settings」). A deployment's settings.local.toml overrides any
# key here, and BMO_REVIEW_<TABLE>__<KEY> in the environment overrides both.

[server]
# Where the service answers, as host:port.
listen = "127.0.0.1:3340"
# The bearer token every caller presents. A deployment names its own.
token = ""

[store]
# The SQLite file the reviews, comments, filings and events stand in.
path = "review.db"

[graph]
# bmo-graph's base address and the token it takes: the projects and their checkouts.
address = "http://127.0.0.1:3296"
token = ""

[job]
# bmo-job's base address and the token it takes: the items filed from a review.
address = "http://127.0.0.1:7841"
token = ""

[screen]
# The folder the console bundle's build writes (`bun run bundle` in client/): its module, its stylesheet and its
# words. A relative one is read from where the process starts; where none stands, the service answers no screen.
bundle = "client/dist"

# The ceilings of reading a checkout and of what a review and a comment take (docs/code-review.md).
[limits]
# A file's body past this many bytes carries only its beginning; a NUL within the first binary_probe bytes
# marks a file binary.
file_bytes = 1000000
binary_probe = 8000
# The most entries one page of a tree holds, and a commit's diff past this many bytes carries only its
# beginning.
tree_entries = 50000
diff_bytes = 2000000
# The content search: the words' length, the lines per file and in all, and its time.
search_query = 200
search_per_file = 5
search_total = 200
search_timeout_ms = 10000
# The definition search: the lines read from one file, the definitions kept from it and in all, and its time.
definition_scan_per_file = 40
definition_per_file = 5
definition_total = 50
definition_timeout_ms = 5000
# How much of a matched line comes back, in characters.
match_line = 300
# How much of the lines a comment points at it keeps, in characters.
excerpt = 20000
# A review's title, a comment's text and an author's name, in characters.
title = 200
comment = 20000
author_name = 200
