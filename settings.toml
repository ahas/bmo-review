# The review service's settings (docs/api.md, 「Settings」). A deployment's settings.local.toml overrides any
# key here, and BMO_REVIEW_<TABLE>__<KEY> in the environment overrides both.

[server]
# Where the service answers, as host:port.
listen = "127.0.0.1:3340"
# The bearer token every caller presents. A deployment names its own.
token = ""

[store]
# The SQLite file the reviews and their threads stand in.
path = "review.db"

[job]
# bmo-job's base address and the token it takes: the worker catalogue and the filing of items.
address = "http://127.0.0.1:7841"
token = ""

[receiver]
# The receiver's base address and the token it takes: the talk under a review.
address = "http://127.0.0.1:3212"
token = ""

[filing]
# The names the item's parts are worded with, filling {owner} and {agent} in the Korean pack. A deployment
# names its own.
owner = "owner"
agent = "agent"
# Who an item filed from a review is requested by.
requester = "owner"
# How much of the reviewed lines an item carries, in characters.
excerpt_clip = 2000

# The ceilings of reading a checkout and of what a review and a filing take (docs/code-review.md).
[limits]
# A file's body past this many bytes carries only its beginning; a NUL within the first binary_probe bytes
# marks a file binary.
file_bytes = 1000000
binary_probe = 8000
# A tree's entries and a commit list's commits.
tree_entries = 50000
commits = 100
# The content search: the words' length, the lines per file and in all, and its time.
search_query = 200
search_per_file = 5
search_total = 200
search_timeout_ms = 10000
# The definition search: the lines read from one file, the definitions kept from it and in all, and its time.
definition_scan_per_file = 40
definition_per_file = 5
definition_total = 50
definition_timeout_ms = 5000
# How much of a matched line comes back, in characters.
match_line = 300
# How much of the reviewed lines a review keeps, in characters.
excerpt = 20000
# A turn's words, and a filing's title, what to do and conclusion, in characters.
talk = 2000
title = 200
to_do = 8000
conclusion = 4000
