# What installing the code review service on a fresh machine needs, read by the testbed's install verb
# (bmo-testbed's docs/install.md, 「The install declaration」). The settings are docs/api.md's 「Settings」.

install = 1

restart = "systemctl --user restart bmo-review.service"

[[needs]]
program = "cargo"
what = "Builds the service; the Rust toolchain from https://rustup.rs."

[[needs]]
program = "bun"
what = "Builds the console bundle at every release; the Bun runtime from https://bun.sh."

[[needs]]
program = "git"
what = "Reads each project's checkout; the git package."

[[port]]
name = "review.server"
number = 3340

[[token]]
name = "review.service"
file = "env/review-service.token"

[[token]]
name = "review.console"
file = "env/review-console.token"

# The release's settings.local.toml. The store stands under the data root. The one project at first is the index
# checkout the install ran from; more are added as further [[projects]] tables and a restart
# (docs/code-review.md, 「Where the projects come from」). Items filed from a review go to bmo-job under the
# token it gives this service, and a member of the console sees the projects the agency records as theirs, the
# agency asked on its control port with the token its own file holds (docs/api.md, 「The console face」).
[[settings]]
file = "env/review.toml"
text = """
[server]
listen = "127.0.0.1:{{port.review.server}}"
token = "{{token.review.service}}"

[store]
path = "{{data_root}}/review/review.db"

[[projects]]
name = "bmo"
checkout = "{{index}}"

[job]
address = "http://127.0.0.1:{{port.job.server}}"
token = "{{token.job.review}}"

[agency]
address = "http://127.0.0.1:{{port.agency.control}}"
token_file = "{{data_root}}/env/agency.token"

[console]
token = "{{token.review.console}}"
"""

[[line]]
file = "env/web-console.env"
key = "REVIEW_ADDRESS"
value = "http://127.0.0.1:{{port.review.server}}"

[[line]]
file = "env/web-console.env"
key = "REVIEW_TOKEN"
value = "{{token.review.console}}"
