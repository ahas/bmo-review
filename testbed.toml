# How the testbed checks, builds and deploys this repository, in the testbed's declaration format. The suite
# runs the repository-wide personal-data check (PERSONAL-DATA.md); the behaviour tests are deferred (README.md).

testbed = 0
name = "bmo-review"

[test]
# The Cargo workspace's crate, and the TypeScript console plugin under client/, a Bun project whose check
# script is its typecheck.
languages = ["cargo", "bun"]
# A fresh tree gets the client's locked packages through the same frozen install its check step runs.
setup = ["cd client && bun install --frozen-lockfile"]

[projects]
# The console plugin bundle under client/ is a project of its own: its manifest stands outside any package
# workspace. Bun runs its check script in the suite, and the client-typecheck step below runs the same
# install and typecheck in the static check.
paths = ["client"]
check_script = "typecheck"

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger names each Korean pack file with its count of Hangul lines; a
# code file it does not name is allowed none. Beside the base libraries, the dependencies take the published
# clients of the upstreams the service calls (docs/api.md, 「Calls this service makes」).
quick = ["korean", "layout", "dependencies", "cargo-profile"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-text", "bmo-graph", "bmo-job-client"]

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

# The console plugin bundle is a project of its own under client/, typechecked against its own install.
[[check.step]]
id = "client-typecheck"
dir = "client"
command = "bun install --frozen-lockfile && bun run typecheck"
when = ["client/**"]

[build]
binaries = ["bmo-review"]

# The service's own deploy tree, and the data root its settings stand under: the data root's env/review.toml,
# which each release links to as settings.local.toml, the file the service reads beside settings.toml
# (docs/api.md, 「Settings」).
[deploy]
root = "~/.local/share/bmo-review"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/review.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed settings name answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-review/deploy/bin/bmo-review health"

# The console bundle built into the release before it goes live, into the folder the service reads when it starts
# (docs/api.md, 「The console bundle」); the release's setup has installed the bundle's packages.
[[deploy.step]]
id = "console-bundle"
command = "cd client && bun run bundle"
phase = "before-flip"
