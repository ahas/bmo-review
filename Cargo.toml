# Code review over git checkouts as one service: projects read at a revision, reviews with their comments, and
# items filed from them into the job service, with the service's client, its OpenAPI document and the harness
# plugin's MCP server, in one binary. The only manifest at the root; the console bundle keeps its own under
# `client/`.
[package]
name = "bmo-review"
description = "Code review over git checkouts: reading at a revision, reviews, comments and filed items."
version = "0.1.0-rev.2"
edition = "2024"
license = "MIT"
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
test = false

[[bin]]
name = "bmo-review"
path = "src/main.rs"
test = false

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# The graph service's published client: the projects and their checkouts.
bmo-graph = { path = "../graph" }
# The job service's published client: the items filed from a review.
bmo-job-client = { path = "../job/crates/client" }
# Text handling the base library serves: a body and an excerpt cut on a character boundary.
bmo-text = { path = "../../base/text", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config = { version = "0.15", default-features = false, features = ["toml"] }
# The event stream's items as they are sent.
futures-util = "0.3.34"
# Each route registers itself beside its own answer.
inventory = "0.3.24"
# SQLite's own interface under the store's connections: the busy handler that waits for another writer's lock.
libsqlite3-sys = { version = "0.30.1", default-features = false }
# A definition search's patterns, read again on the lines git found.
regex = "1.13.1"
# The service's own client.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
# The harness plugin's MCP server.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# The JSON Schemas of the bodies, the tools' inputs and outputs and the OpenAPI document.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# Answers keep their fields in the order they are written.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The console bundle's version, a digest of its files.
sha2 = "0.10.9"
# The store: reviews, comments, filings and events in one SQLite file.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
# The event stream's live part, a broadcast read as a stream.
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }

[[test]]
name = "main"
path = "tests/main.rs"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
