# The item filed from a review (docs/code-review.md, 「The item's shape」): where each part's words came from —
# the console for the place, the {owner} at the moment {at} the item was filed, each speaker of the thread — what
# the work is, and what it came to where the owner left that to the service. {owner} and {agent} are the names the
# settings give; {id} is the review's number.
source: "콘솔 코드 리뷰 #{id}에서 적음"
owner_filed: "{owner}, {at}, 콘솔 코드 리뷰 #{id}에서"
owner_turn: "{owner}, {at}, 코드 리뷰 #{id}"
agent_turn: "{agent}, {at}, 코드 리뷰 #{id}"
what: "{label}({worker}) 워커의 체크아웃 {root}, 커밋 {commit}의 {place}에 단 코드 리뷰에서 올린 리팩토링이다."
pinned: "리뷰는 그 커밋에 고정되어 있다. 작업 트리의 파일이 그사이 바뀌었으면 그 커밋의 버전과 견주어 읽는다."
excerpt: "그 커밋에서 리뷰가 가리킨 줄:"
conclusion: "{owner}가 코드 리뷰 #{id}에서 {label} 워커에게 {place}의 리팩토링을 지시했다."
